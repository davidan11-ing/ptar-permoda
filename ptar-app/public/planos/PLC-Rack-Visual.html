{id:'AQ1',slot:11,label:'1AQ · AQ 2×I 4-20mA',ref:'6ES7 135-6GB00-0BA1',cl:'#4A0808',tc:'#FF9080',
 desc:'Salidas analógicas 4-20mA · %QW4–%QW6 · %QW4 = ref. velocidad VFD',tags:['%QW4–%QW6','→ VFD ACS310'],
 terminals:[
  {pin:'L+',  addr:'24VDC',sig:'Alimentación 24VDC módulo AQ',dest:'Bus L+ interno',type:'pwr'},
  {pin:'M',   addr:'0V',   sig:'Referencia GND',              dest:'Bus M interno', type:'pwr'},
  {pin:'AQ0+',addr:'%QW4', sig:'BCE4.06 — Ref. velocidad VFD ACS310 AI1+',dest:'VFD ACS310 AI1 (+)',type:'aq'},
  {pin:'AQ0−',addr:'%QW4', sig:'BCE4.06 — Retorno lazo AQ (−)',             dest:'VFD ACS310 AI1 (−)',type:'aq'},
  {pin:'AQ1+',addr:'%QW6', sig:'— Reserva',dest:'—',type:'avl'},
  {pin:'AQ1−',addr:'%QW6', sig:'— Reserva',dest:'—',type:'avl'},
]},
];

// ─────────────────────────────────────────────────────────────────────────────
// COLORS
// ─────────────────────────────────────────────────────────────────────────────
function tc(type){
  return {di:'#22BB66',dq:'#FF5555',ai:'#FFB030',aq:'#FF8844',dp:'#CC80EE',eth:'#44AAEE',pwr:'#5A6A88',pe:'#F5A623',avl:'#181818'}[type]||'#444';
}
function shortDest(t){
  if(t.type==='avl') return '—';
  if(t.type==='pwr') return t.addr==='24VDC'?'L+':t.addr==='0V'?'M':'PE';
  if(t.type==='pe') return 'PE';
  if(t.type==='eth') return t.addr==='ETH'?'ETH':'P2';
  if(t.type==='dp') return t.addr;
  if(t.type==='di'){
    if(t.sigType==='STP') return 'ESTOP';
    if(t.sigType==='LS') return t.sig.match(/LS(\d+)/)?.[0]||'LS';
    if(t.motN) return `M${t.motN}·${t.sigType||'?'}`;
    return t.addr.replace('%I','I');
  }
  if(t.type==='dq') return t.motN?`M${t.motN}·KB`:'DQ';
  if(t.type==='ai') return t.inst||t.addr.replace('%','');
  if(t.type==='aq') return t.sig.includes('Reserva')?'—':'VFD';
  return t.addr.replace('%','');
}

const TW=8.5;  // terminal block width (per terminal)
const GAP=7;   // gap between modules

// ─────────────────────────────────────────────────────────────────────────────
// COMPUTE MODULE POSITIONS
// ─────────────────────────────────────────────────────────────────────────────
let cx_=8;
const RM=MODS.map(mod=>{
  const mw=Math.max(mod.id==='CPU'?120:mod.id==='CMDP'?100:70,
                    mod.terminals.length*TW+10);
  const rx=cx_;
  cx_+=mw+GAP;
  return {...mod, rx, mw};
});
const SW_RACK=cx_+8;

// ─────────────────────────────────────────────────────────────────────────────
// SVG BUILDER
// ─────────────────────────────────────────────────────────────────────────────
function buildRack(){
  const svg=document.getElementById('rack-svg');

  // ── Dynamic layout — adapts to screen height ───────────────────────────────
  const hdrH=document.getElementById('hdr').offsetHeight||50;
  const availH=Math.max(480, window.innerHeight - hdrH - 16);

  const BUS_Y=14, BUS_H=11;
  const RAIL_Y=25, RAIL_H=7;
  const MOD_Y=32, MOD_H=205;       // taller module for bigger text
  const PIN_Y=MOD_Y+MOD_H;         // = 237
  const PIN_H=28;                   // taller pin strip
  const DUCT_Y=PIN_Y+PIN_H;        // = 265
  const DUCT_H=13;
  const CAB_Y=DUCT_Y+DUCT_H;       // cables start = 278
  const DST_RESERVE=72;             // space for rotated labels at bottom
  const CAB_E=availH-DST_RESERVE;  // cables end — dynamic
  const DST_Y=CAB_E+5;
  const SH=availH;

  svg.setAttribute('width', SW_RACK);
  svg.setAttribute('height', SH);
  svg.setAttribute('viewBox', `0 0 ${SW_RACK} ${SH}`);

  let h=`<defs>
  <filter id="ggl" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ggm" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  </defs>`;

  // Background
  h+=`<rect x="0" y="0" width="${SW_RACK}" height="${SH}" fill="#080809"/>`;

  // ── 24VDC bus bars at top ──────────────────────────────────────────────────
  h+=`<rect x="6" y="${BUS_Y}" width="${SW_RACK-12}" height="${BUS_H}" rx="2" fill="#083A10" stroke="#0F6020" stroke-width="0.8" filter="url(#ggm)"/>`;
  h+=`<text x="14" y="${BUS_Y+8}" fill="#1A8030" font-size="8.5" font-weight="700" letter-spacing=".5">■ BUS 24VDC L+ / M — AD1 · AD2 (Mean Well NDR-240-24)</text>`;

  // ── DIN rail backplane ─────────────────────────────────────────────────────
  h+=`<rect x="4" y="${RAIL_Y}" width="${SW_RACK-8}" height="${RAIL_H}" rx="1" fill="#282828"/>`;
  h+=`<rect x="4" y="${RAIL_Y+1}" width="${SW_RACK-8}" height="3" rx="1" fill="#3A3A3A" opacity=".5"/>`;

  // ── Cable duct ─────────────────────────────────────────────────────────────
  h+=`<rect x="4" y="${DUCT_Y}" width="${SW_RACK-8}" height="${DUCT_H}" rx="2" fill="#0D0D0E" stroke="#1A1A1A" stroke-width="1"/>`;
  h+=`<text x="14" y="${DUCT_Y+9}" fill="#252525" font-size="8" font-weight="700" letter-spacing=".8">CANALETA / CABLE MANAGEMENT</text>`;

  // ── Cable zone alternating background stripes ──────────────────────────────
  RM.forEach((mod,mi)=>{
    const op=mi%2===0?0.022:0;
    if(op>0) h+=`<rect x="${mod.rx}" y="${CAB_Y}" width="${mod.mw}" height="${CAB_E-CAB_Y}" fill="#FFFFFF" opacity="${op}"/>`;
  });

  // ── Modules ────────────────────────────────────────────────────────────────
  RM.forEach(mod=>{
    const {rx,mw,cl,tc:mtc,id,terminals:T}=mod;
    const mcx=rx+mw/2;

    // Module group (click/dim target)
    h+=`<g class="mod-g" id="mg-${id}" data-mod="${id}" onclick="clickMod('${id}')">`;

    // Module body
    h+=`<rect x="${rx}" y="${MOD_Y}" width="${mw}" height="${MOD_H}" rx="3" fill="${cl}" stroke="${mtc}" stroke-width="1.3" filter="url(#ggl)" class="mod-body"/>`;

    // Bottom shadow strip
    h+=`<rect x="${rx+1}" y="${MOD_Y+MOD_H-10}" width="${mw-2}" height="10" rx="0" fill="rgba(0,0,0,.45)"/>`;

    // LED indicators (top)
    for(let i=0;i<3;i++){
      h+=`<circle cx="${rx+11+i*12}" cy="${MOD_Y+11}" r="4" fill="#080808" stroke="#1A1A1A" stroke-width="0.8"/>`;
    }
    h+=`<circle cx="${rx+11}" cy="${MOD_Y+11}" r="2.8" fill="#00CC33" opacity=".85" filter="url(#ggm)"/>`;

    // Top color band
    h+=`<rect x="${rx+2}" y="${MOD_Y+20}" width="${mw-4}" height="3.5" rx="0" fill="${mtc}" opacity=".55"/>`;

    // Module ID label — big
    h+=`<text x="${mcx}" y="${MOD_Y+43}" text-anchor="middle" fill="${mtc}" font-size="${mw>110?14:12}" font-weight="800" font-family="-apple-system,Arial,sans-serif">${id}</text>`;

    // Slot + ref
    const refFrag=mod.ref.split(' ').slice(-1)[0]||'';
    h+=`<text x="${mcx}" y="${MOD_Y+57}" text-anchor="middle" fill="${mtc}" font-size="8" font-family="monospace" opacity=".55">Slot ${mod.slot}</text>`;
    h+=`<text x="${mcx}" y="${MOD_Y+68}" text-anchor="middle" fill="${mtc}" font-size="7" font-family="monospace" opacity=".4">${refFrag}</text>`;

    // Address range — prominent
    const sigs=T.filter(t=>t.type!=='pwr'&&t.type!=='pe'&&t.type!=='avl');
    if(sigs.length>0){
      const aFirst=sigs[0].addr.replace('%','');
      const aLast=sigs[sigs.length-1].addr.replace('%','');
      const addrLbl=aFirst===aLast?aFirst:`${aFirst}–${aLast.split('.').pop()}`;
      h+=`<text x="${mcx}" y="${MOD_Y+84}" text-anchor="middle" fill="${mtc}" font-size="9.5" font-weight="700" font-family="monospace" opacity=".8">${addrLbl}</text>`;
    }

    // Signal count badge
    const sigCount=T.filter(t=>t.type!=='pwr'&&t.type!=='pe'&&t.type!=='avl').length;
    h+=`<rect x="${rx+5}" y="${MOD_Y+MOD_H-42}" width="${mw-10}" height="19" rx="3" fill="rgba(0,0,0,.55)" stroke="${mtc}" stroke-width=".6" opacity=".65"/>`;
    h+=`<text x="${mcx}" y="${MOD_Y+MOD_H-29}" text-anchor="middle" fill="${mtc}" font-size="9" font-weight="700" opacity=".8">${sigCount} señales activas</text>`;

    // Type label
    const typelbl=T.find(t=>!['pwr','pe','avl'].includes(t.type))?.type?.toUpperCase()||'PWR';
    h+=`<text x="${mcx}" y="${MOD_Y+MOD_H-13}" text-anchor="middle" fill="${mtc}" font-size="11" font-weight="800" letter-spacing=".6" opacity=".5">${typelbl}</text>`;

    // ── Terminal pins (inside mod-g → dims with module) ────────────────────
    const twi=(mw-6)/T.length - 0.5;
    T.forEach((t,ti)=>{
      const tx=rx+3+ti*(mw-6)/T.length;
      const tcx_=tx+twi/2;
      const clr=tc(t.type);
      const isAvl=t.type==='avl';
      const isPwr=t.type==='pwr'||t.type==='pe';

      h+=`<rect x="${tx}" y="${PIN_Y}" width="${twi}" height="${PIN_H}" rx=".5"
        fill="${isAvl?'#0C0C0C':isPwr?'#141420':'#0A0A12'}"
        stroke="${isAvl?'#141414':clr}" stroke-width="${isAvl?.25:isPwr?.6:1}"
        opacity="${isAvl?.22:1}"/>`;

      if(!isAvl){
        h+=`<circle cx="${tcx_}" cy="${PIN_Y+7}" r="${Math.min(4,twi/2-0.8)}"
          fill="rgba(0,0,0,.65)" stroke="${clr}" stroke-width=".7" opacity=".75"/>`;
        if(twi>5){
          const lbl=t.addr.replace('%I','').replace('%Q','Q').replace('%IW','IW').replace('%QW','QW').replace('24VDC','L+').replace('0V','M');
          h+=`<text x="${tcx_}" y="${PIN_Y+PIN_H-3}" fill="${clr}" font-size="5.5"
            text-anchor="middle" font-family="monospace" opacity=".8"
            transform="rotate(-90,${tcx_},${PIN_Y+13})">${lbl}</text>`;
        }
      }
    });

    h+=`</g>`; // close mod-g

    // ── Cable lines (outside mod-g — independent dim/sel) ────────────────────
    T.forEach((t,ti)=>{
      const tx=rx+3+ti*(mw-6)/T.length;
      const tcx_=tx+twi/2;
      const clr=tc(t.type);
      const isAvl=t.type==='avl';
      const isPwr=t.type==='pwr'||t.type==='pe';

      if(!isAvl){
        const cOP=isPwr?0.14:0.55;
        const cSW=isPwr?1.3:1.5;

        h+=`<g class="cab-g" id="cab-${id}-${ti}" data-mod="${id}" data-idx="${ti}"
          data-type="${t.type}" onclick="clickCab('${id}',${ti})">`;

        h+=`<line x1="${tcx_}" y1="${CAB_Y}" x2="${tcx_}" y2="${CAB_E}"
          stroke="${clr}" stroke-width="${cSW}" opacity="${cOP}"
          stroke-dasharray="${isPwr?'4 4':''}" class="cable-line"/>`;

        h+=`<circle cx="${tcx_}" cy="${CAB_Y}" r="2.2" fill="${clr}" opacity="${Math.min(1,cOP*1.5)}"/>`;

        if(!isPwr){
          const dlbl=shortDest(t);
          h+=`<text x="${tcx_}" y="${DST_Y}" fill="${clr}" font-size="8"
            text-anchor="start" font-family="-apple-system,Arial,sans-serif"
            font-weight="600" opacity=".7" transform="rotate(90,${tcx_},${DST_Y})">${dlbl}</text>`;
        }
        h+=`</g>`;
      }
    });
  });

  // ── Module separators ──────────────────────────────────────────────────────
  RM.forEach((m,i)=>{
    if(i>0){
      h+=`<line x1="${m.rx-3}" y1="${MOD_Y}" x2="${m.rx-3}" y2="${PIN_Y+PIN_H}"
        stroke="#222" stroke-width="1.2" opacity=".9"/>`;
    }
  });

  // ── Slot numbers on DIN rail ───────────────────────────────────────────────
  RM.forEach(m=>{
    h+=`<text x="${m.rx+m.mw/2}" y="${RAIL_Y+6}" text-anchor="middle"
      fill="#404040" font-size="7" font-weight="700">S${m.slot}</text>`;
  });

  svg.innerHTML=h;
}

// ─────────────────────────────────────────────────────────────────────────────
// INTERACTION
// ─────────────────────────────────────────────────────────────────────────────
let selMod=null, selCab=null;

function clearSel(){
  selMod=null; selCab=null;
  document.querySelectorAll('.mod-g').forEach(g=>g.classList.remove('sel','dim'));
  document.querySelectorAll('.cab-g').forEach(g=>g.classList.remove('sel','dim'));
  document.getElementById('info').innerHTML=`<div id="info-empty">🔌<br><br>Clic en un módulo o terminal para ver el detalle</div>`;
}

function clickMod(id){
  if(selMod===id&&selCab===null){clearSel();return;}
  selMod=id; selCab=null;
  document.querySelectorAll('.mod-g').forEach(g=>{
    const gid=g.dataset.mod;
    g.classList.remove('sel','dim');
    if(gid===id) g.classList.add('sel');
    else g.classList.add('dim');
  });
  document.querySelectorAll('.cab-g').forEach(g=>{
    g.classList.remove('sel','dim');
    if(g.dataset.mod!==id) g.classList.add('dim');
  });
  const mod=RM.find(m=>m.id===id);
  if(mod) showModInfo(mod);
}

function clickCab(modId,idx){
  const key=`${modId}-${idx}`;
  if(selCab===key){clearSel();return;}
  selMod=modId; selCab=key;
  document.querySelectorAll('.mod-g').forEach(g=>{
    g.classList.remove('sel','dim');
    if(g.dataset.mod===modId) g.classList.add('sel');
    else g.classList.add('dim');
  });
  document.querySelectorAll('.cab-g').forEach(g=>{
    g.classList.remove('sel','dim');
    const gkey=`${g.dataset.mod}-${g.dataset.idx}`;
    if(gkey===key) g.classList.add('sel');
    else g.classList.add('dim');
  });
  const mod=RM.find(m=>m.id===modId);
  if(mod){
    const t=mod.terminals[idx];
    if(t) showTermInfo(mod,t,idx);
  }
}

function showModInfo(mod){
  const sigCount=mod.terminals.filter(t=>!['pwr','pe','avl'].includes(t.type)).length;
  const tags=mod.tags.map(t=>`<span style="border:1px solid ${mod.cl};color:${mod.tc};border-radius:3px;padding:1px 6px;font-size:7.5px;font-weight:600;display:inline-block;margin:1px">${t}</span>`).join(' ');
  document.getElementById('info').innerHTML=`
    <div id="info-id" style="color:${mod.tc};font-size:20px;font-weight:800;margin-bottom:2px">${mod.id}</div>
    <div style="font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:${mod.tc};opacity:.4;margin-bottom:8px">Slot ${mod.slot}</div>
    <div style="font-size:11px;color:#999;margin-bottom:10px;line-height:1.5">${mod.desc}</div>
    <div style="margin-bottom:10px">${tags}</div>
    <div class="isep"></div>
    <div class="irow"><span class="ilbl">Ref.</span><span class="ival" style="font-family:monospace;font-size:9px">${mod.ref}</span></div>
    <div class="irow"><span class="ilbl">Señales</span><span class="ival">${sigCount} activas · ${mod.terminals.length} terminales total</span></div>
    <div class="irow"><span class="ilbl">Rango</span><span class="ival" style="font-family:monospace">${mod.terminals.find(t=>!['pwr','pe','avl'].includes(t.type))?.addr||'—'}</span></div>`;
}

function showTermInfo(mod,t,idx){
  const clr=tc(t.type);
  const typelbl={di:'Entrada Digital',dq:'Salida Digital',ai:'Entrada Analógica',aq:'Salida Analógica',dp:'Profibus DP',eth:'PROFINET ETH',pwr:'Alimentación 24VDC',pe:'Tierra / PE',avl:'Disponible'}[t.type]||t.type;
  document.getElementById('info').innerHTML=`
    <div style="color:${clr};font-size:20px;font-weight:800;margin-bottom:2px">${t.pin||t.addr}</div>
    <div style="color:${clr};font-size:11px;font-family:monospace;font-weight:700;margin-bottom:3px">${t.addr}</div>
    <div style="font-size:8px;text-transform:uppercase;letter-spacing:.6px;color:${clr};opacity:.45;margin-bottom:9px">${typelbl} · ${mod.id}</div>
    <div style="font-size:11px;color:#AAA;margin-bottom:10px;line-height:1.5">${t.sig}</div>
    <div class="isep"></div>
    <div class="irow"><span class="ilbl">Destino</span><span class="ival">${t.dest||'—'}</span></div>
    <div class="irow"><span class="ilbl">Cable</span><span class="ival" style="font-family:monospace;font-size:9px">${t.cable||'—'}</span></div>
    ${t.note?`<div class="irow"><span class="ilbl">Nota</span><span class="ival" style="color:#4A5A70;font-style:italic;font-size:10px">${t.note}</span></div>`:''}
    <div class="isep"></div>
    <div class="irow"><span class="ilbl">Módulo</span><span class="ival" style="color:${mod.tc}">${mod.label}</span></div>
    <div class="irow"><span class="ilbl">Slot</span><span class="ival">Slot ${mod.slot} · Terminal ${idx+1}/${mod.terminals.length}</span></div>`;
}

window.addEventListener('DOMContentLoaded',()=>{
  buildRack();
  document.getElementById('canvas').addEventListener('click',e=>{
    if(e.target===e.currentTarget||e.target.tagName==='svg'||e.target.id==='svg-wrap') clearSel();
  });
});

// Rebuild on resize to keep cables compact and on-screen
let _resizeT;
window.addEventListener('resize',()=>{
  clearTimeout(_resizeT);
  _resizeT=setTimeout(()=>{
    const sm=selMod, sc=selCab;
    buildRack();
    if(sm&&!sc) clickMod(sm);
    else if(sm&&sc){
      const [,idx]=sc.split('-').slice(-1)[0]?[sm,parseInt(sc.split('-').pop())]:['',0];
      // re-apply highlight after rebuild
      document.querySelectorAll('.mod-g').forEach(g=>{
        g.classList.remove('sel','dim');
        if(g.dataset.mod===sm) g.classList.add('sel'); else g.classList.add('dim');
      });
      document.querySelectorAll('.cab-g').forEach(g=>{
        g.classList.remove('sel','dim');
        if(`${g.dataset.mod}-${g.dataset.idx}`===sc) g.classList.add('sel'); else g.classList.add('dim');
      });
    }
  }, 120);
});
</script>
</body>
