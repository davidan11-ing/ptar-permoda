function diMotor(motN,ch,startPin){
  const m=MTAG[motN];
  if(!m||m.type==='avl') return [
    {addr:ch[0],sig:'—  Disponible',dest:'—',type:'avl',cable:'—',note:'',pin:String(startPin)},
    {addr:ch[1],sig:'—  Disponible',dest:'—',type:'avl',cable:'—',note:'',pin:String(startPin+1)},
    {addr:ch[2],sig:'—  Disponible',dest:'—',type:'avl',cable:'—',note:'',pin:String(startPin+2)},
  ];
  const re=m.type==='vfd'?'Habilitación VFD':'SC Selector remoto';
  const rn=m.type==='vfd'?'VFD RUN (en marcha)':'KM Contacto aux. (marcha)';
  const fl=m.type==='vfd'?'VFD FAULT':`${m.qf} Contacto aux. (fallo)`;
  return [
    {addr:ch[0],pin:String(startPin),  sig:`M${motN}·${m.tag} — ${re}`,  dest:`${m.born}→ SC Local-Off-Remote`, type:'di',cable:'KVVP 2×0.75 VD',note:''},
    {addr:ch[1],pin:String(startPin+1),sig:`M${motN}·${m.tag} — ${rn}`,  dest:`${m.born}→ ${m.km} aux NO`,      type:'di',cable:'KVVP 2×0.75 VD',note:''},
    {addr:ch[2],pin:String(startPin+2),sig:`M${motN}·${m.tag} — ${fl}`,  dest:`${m.born}→ ${m.qf} aux NC`,      type:'di',cable:'KVVP 2×0.75 VD',note:''},
  ];
}

// ─────────────────────────────────────────────────────────────────────────────
// VISUAL RENDER
// ─────────────────────────────────────────────────────────────────────────────
function tc(type){
  const C={di:'#22BB66',dq:'#FF5555',ai:'#FFB030',aq:'#FF8844',dp:'#CC80EE',eth:'#44AAEE',pwr:'#5A6A88',pe:'#F5A623',avl:'#1E1E1E'};
  return C[type]||'#555';
}
function trunc(s,n){return s&&s.length>n?s.slice(0,n-1)+'…':s||''}

function renderMod(mod){
  const TS=mod.terminals;
  const SW=1042, ROW_H=32, HDR_H=64;
  const SH=HDR_H+TS.length*ROW_H+18;

  // Column X positions
  const MBX=4, MBW=86;          // module body: 4→90
  const PNX=MBX+MBW;            // pin nubs start: 90
  const PNW=10;                  // pin nub width
  const ADX=PNX+PNW+8;          // address area start: 108
  const ADW=106;                 // address area width
  const CBX=ADX+ADW;            // cable start: 214
  const CBE=SW-272;             // cable end: 770
  const DSX=CBE+10;             // destination start: 780
  const DSW=SW-DSX-8;          // destination width: ~254

  let h=`<svg viewBox="0 0 ${SW} ${SH}" width="${SW}" height="${SH}" xmlns="http://www.w3.org/2000/svg">`;

  // Defs
  h+=`<defs>
  <filter id="mglo" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>`;
  ['di','dq','ai','aq','dp','eth','pe'].forEach(t=>{
    const c=tc(t);
    h+=`<marker id="ar_${t}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0.5 6,3.5 0,6.5" fill="${c}" opacity=".85"/>
    </marker>`;
  });
  h+=`</defs>`;

  // Canvas background
  h+=`<rect x="0" y="0" width="${SW}" height="${SH}" fill="#070708"/>`;

  // Cable zone background (subtle)
  h+=`<rect x="${ADX}" y="2" width="${SW-ADX-2}" height="${SH-4}" rx="2" fill="#090910" opacity=".7"/>`;

  // Column separators
  [ADX-1,CBX-1,DSX-3].forEach(x=>{
    h+=`<line x1="${x}" y1="2" x2="${x}" y2="${SH-2}" stroke="#12121E" stroke-width="1"/>`;
  });

  // Column header labels
  h+=`<text x="${ADX+5}" y="14" fill="#182030" font-size="6.5" font-weight="700" letter-spacing=".7" font-family="-apple-system,Arial,sans-serif">PIN · DIRECCIÓN</text>`;
  h+=`<text x="${(CBX+CBE)/2}" y="14" fill="#182030" font-size="6.5" font-weight="700" letter-spacing=".7" text-anchor="middle" font-family="-apple-system,Arial,sans-serif">SEÑAL / FUNCIÓN</text>`;
  h+=`<text x="${DSX+DSW/2}" y="14" fill="#182030" font-size="6.5" font-weight="700" letter-spacing=".7" text-anchor="middle" font-family="-apple-system,Arial,sans-serif">DESTINO / BORNE</text>`;

  // Module body
  h+=`<rect x="${MBX}" y="6" width="${MBW}" height="${SH-12}" rx="4" fill="${mod.cl}" filter="url(#mglo)" stroke="${mod.tc}" stroke-width="1.2" opacity=".85"/>`;
  // Module label
  const mshort=mod.label.split('·')[0].trim();
  h+=`<text x="${MBX+MBW/2}" y="29" fill="${mod.tc}" font-size="9" font-weight="800" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" letter-spacing=".3">${mshort}</text>`;
  h+=`<text x="${MBX+MBW/2}" y="43" fill="${mod.tc}" font-size="7" text-anchor="middle" font-family="monospace" opacity=".5">Slot ${mod.slot}</text>`;
  h+=`<text x="${MBX+MBW/2}" y="57" fill="${mod.tc}" font-size="9" font-weight="700" text-anchor="middle" font-family="monospace" letter-spacing=".8" opacity=".65">${mod.id}</text>`;

  // Alternating row stripes
  TS.forEach((_,i)=>{
    if(i%2===0) h+=`<rect x="${ADX}" y="${HDR_H+i*ROW_H}" width="${SW-ADX-2}" height="${ROW_H}" fill="#0C0C14" opacity=".5"/>`;
  });

  // Terminal rows
  TS.forEach((t,i)=>{
    const ry=HDR_H+i*ROW_H+ROW_H/2;
    const clr=tc(t.type);
    const isAvl=t.type==='avl';
    const isPwr=t.type==='pwr'||t.type==='pe';
    const onclick=isAvl?'':` onclick="clickRow(${i},'${mod.id}')"`;

    h+=`<g class="wrow${isAvl?' wrow-avl':''}" data-idx="${i}"${onclick}>`;

    // Pin nub on module right edge
    h+=`<rect x="${PNX}" y="${ry-5}" width="${PNW}" height="10" rx="1"
      fill="${isAvl?'#181818':clr}" opacity="${isAvl?.08:.72}" class="wr-pin"/>`;

    // Pin label inside module
    h+=`<text x="${MBX+4}" y="${ry+4}" fill="${isAvl?'#1C1C1C':clr}"
      font-size="6.5" font-family="monospace" font-weight="600"
      opacity="${isAvl?.15:.55}" class="wr-pin">${trunc(t.pin,10)}</text>`;

    // PLC address
    h+=`<text x="${ADX+5}" y="${ry+5}" fill="${isAvl?'#1A1A1A':clr}"
      font-size="${isPwr?'7.5':'9.5'}" font-weight="700" font-family="monospace"
      opacity="${isAvl?.15:1}" class="wr-addr">${t.addr}</text>`;

    if(!isAvl){
      if(isPwr){
        // Short dashed power line
        h+=`<line x1="${PNX+PNW}" y1="${ry}" x2="${CBX+100}" y2="${ry}"
          stroke="${clr}" stroke-width="1.2" stroke-dasharray="5 4"
          opacity=".28" class="wr-line"/>`;
        h+=`<text x="${CBX+107}" y="${ry+4}" fill="${clr}"
          font-size="7.5" opacity=".28">⊕ BUS 24VDC · L+/M interno</text>`;
      } else {
        // Glow copy
        h+=`<line x1="${PNX+PNW}" y1="${ry}" x2="${CBE}" y2="${ry}"
          stroke="${clr}" stroke-width="7" opacity=".05" class="wr-glow"/>`;
        // Main cable
        h+=`<line x1="${PNX+PNW}" y1="${ry}" x2="${CBE}" y2="${ry}"
          stroke="${clr}" stroke-width="1.8" opacity=".62" class="wr-line"
          marker-end="url(#ar_${t.type})"/>`;
        // Signal label above cable
        h+=`<text x="${(PNX+PNW+CBE)/2}" y="${ry-8}" fill="${clr}"
          font-size="7.5" text-anchor="middle" opacity=".65"
          font-family="-apple-system,Arial,sans-serif" class="wr-sig">${trunc(t.sig,66)}</text>`;
        // Destination box
        h+=`<rect x="${DSX}" y="${ry-12}" width="${DSW}" height="24" rx="3"
          fill="#07070E" stroke="${clr}" stroke-width=".8" opacity=".88" class="wr-dest-bg"/>`;
        h+=`<text x="${DSX+6}" y="${ry+4}" fill="${clr}"
          font-size="8.5" opacity=".88" class="wr-dest">${trunc(t.dest,38)}</text>`;
        h+=`<text x="${DSX+6}" y="${ry+17}" fill="#2A2A2A"
          font-size="6.5" opacity=".65">${t.cable}</text>`;
      }
    }
    h+=`</g>`;
  });

  h+=`</svg>`;
  return h;
}

// ─────────────────────────────────────────────────────────────────────────────
// RACK NAV
// ─────────────────────────────────────────────────────────────────────────────
function buildRackNav(){
  const nav=document.getElementById('rack-nav');
  MODS.forEach(m=>{
    const d=document.createElement('div');
    d.className='rnmod'; d.id='rn-'+m.id;
    d.onclick=()=>selectMod(m.id);
    const firstSig=m.terminals.find(t=>t.type!=='pwr');
    const addrShort=firstSig?firstSig.addr.replace('%','').split('.')[0]+'…':'—';
    d.innerHTML=`
      <div class="rn-chip" style="background:${m.cl};color:${m.tc}">${m.label.split('·')[0].replace('×24VDC ST','').trim().split(' ').slice(0,2).join(' ')}</div>
      <div class="rn-lbl" style="color:${m.tc}">${m.id}</div>
      <div class="rn-addr">${addrShort}</div>`;
    nav.appendChild(d);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// INTERACTION
// ─────────────────────────────────────────────────────────────────────────────
let selModId=null, selRowIdx=null;

function selectMod(id){
  selModId=id; selRowIdx=null;
  document.querySelectorAll('.rnmod').forEach(n=>n.classList.remove('active'));
  document.getElementById('rn-'+id)?.classList.add('active');

  const mod=MODS.find(m=>m.id===id);
  if(!mod) return;

  // Update desc bar
  const bar=document.getElementById('mod-desc-bar');
  const tags=mod.tags.map(t=>`<span class="mdb-tag" style="color:${mod.tc};border-color:${mod.cl}">${t}</span>`).join('');
  bar.innerHTML=`
    <div class="mdb-title" style="color:${mod.tc}">${mod.label}</div>
    <div class="mdb-ref">${mod.ref}</div>
    <div class="mdb-tags">${tags}</div>
    <div style="font-size:9px;color:#2A3A4A;margin-left:4px">${mod.desc}</div>`;

  // Render SVG
  document.getElementById('wsvg-wrap').innerHTML=renderMod(mod);

  // Reset detail
  document.getElementById('det').innerHTML=`<div id="det-empty">🔌<br><br>Clic en un terminal para ver el detalle</div>`;
}

function clickRow(idx,modId){
  // Toggle off if same row
  if(selRowIdx===idx&&selModId===modId){
    selRowIdx=null;
    document.querySelectorAll('.wrow').forEach(g=>g.classList.remove('sel','dim'));
    document.getElementById('det').innerHTML=`<div id="det-empty">🔌<br><br>Clic en un terminal para ver el detalle</div>`;
    return;
  }
  selRowIdx=idx;

  document.querySelectorAll('.wrow').forEach(g=>{
    const gi=parseInt(g.dataset.idx);
    g.classList.remove('sel','dim');
    if(gi===idx) g.classList.add('sel');
    else         g.classList.add('dim');
  });

  const mod=MODS.find(m=>m.id===modId);
  if(mod) showDet(mod,idx);
}

function showDet(mod,idx){
  const t=mod.terminals[idx];
  const clr=tc(t.type);
  const typelbl={di:'Entrada Digital',dq:'Salida Digital',ai:'Entrada Analógica',aq:'Salida Analógica',
    dp:'Profibus DP',eth:'PROFINET ETH',pwr:'Alimentación 24VDC',pe:'Tierra / PE',avl:'Disponible'}[t.type]||t.type.toUpperCase();

  document.getElementById('det').innerHTML=`
    <div id="det-pin" style="color:${clr}">${t.pin}</div>
    <div id="det-addr" style="color:${clr};font-size:12px;font-family:monospace;font-weight:700;margin-bottom:2px">${t.addr}</div>
    <div id="det-type" style="color:${clr};font-size:8px;text-transform:uppercase;letter-spacing:.6px;opacity:.45;margin-bottom:9px">${typelbl}</div>
    <div id="det-sig" style="font-size:11px;color:#AAA;margin-bottom:10px;line-height:1.5">${t.sig}</div>
    <div class="dsep"></div>
    <div class="dr"><span class="dl">Destino</span><span class="dv">${t.dest}</span></div>
    <div class="dr"><span class="dl">Cable</span><span class="dv" style="font-family:monospace;font-size:9.5px">${t.cable}</span></div>
    ${t.note?`<div class="dr"><span class="dl">Nota</span><span class="dv" style="color:#4A5A70;font-style:italic;font-size:10px">${t.note}</span></div>`:''}
    <div class="dsep"></div>
    <div class="dr"><span class="dl">Módulo</span><span class="dv" style="color:${mod.tc}">${mod.label}</span></div>
    <div class="dr"><span class="dl">Ref.</span><span class="dv" style="font-family:monospace;font-size:9px;color:#4A4A4A">${mod.ref}</span></div>
    <div class="dr"><span class="dl">Slot</span><span class="dv">Slot ${mod.slot}</span></div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  buildRackNav();
  selectMod('DI1'); // default: first DI module
});
